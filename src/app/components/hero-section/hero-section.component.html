<div class="bg-[var(--p-surface-background)]">
  <header class="fixed top-0 z-10 w-full border-b py-1 bg-opacity-90 backdrop-blur-lg"
    style="border-color: var(--p-border-color); background-color: var(--p-surface-background);">
    <nav class="mx-auto max-w-7xl rounded-b-xl px-4 sm:px-6 lg:px-8">
      <div class="w-full lg:flex lg:items-center lg:gap-2">
        <div class="flex items-center justify-between max-lg:w-full">
          <a class="flex items-center gap-3 text-xl font-bold" href="#" style="color: var(--p-text-default);">
            <img src="logo.png" class="w-[150px] logo" alt="brand-logo" />
          </a>
          <div class="flex items-center gap-5 lg:hidden">
            <a href="#" class="inline-flex items-center gap-2 rounded-lg px-4 py-2 font-semibold transition-all"
              style="background-color: var(--p-primary-color); color: var(--p-primary-inverse-color);">
              Login
            </a>
            <button type="button" class="inline-flex items-center justify-center rounded-lg p-2 transition-all"
              style="background-color: transparent; color: var(--p-text-default); border: 1px solid var(--p-border-color);"
              (click)="toggleMobileMenu()" aria-label="Toggle navigation">
              <span class="text-xl" [class.hidden]="isMobileMenuOpen">☰</span>
              <span class="text-xl" [class.hidden]="!isMobileMenuOpen">✕</span>
            </button>
          </div>
        </div>
        <div class="grow overflow-hidden font-medium duration-300 lg:flex lg:justify-center"
          [class.hidden]="!isMobileMenuOpen" [class.flex]="isMobileMenuOpen">
          <div class="flex gap-6 text-base max-lg:mt-4 max-lg:flex-col lg:items-center"
            style="color: var(--p-text-default);">
            <a href="#" class="hover:opacity-80 transition-opacity">Home</a>
            <a href="#" class="hover:opacity-80 transition-opacity">Products</a>
            <a href="#" class="hover:opacity-80 transition-opacity">About Us</a>
            <a href="#" class="hover:opacity-80 transition-opacity">Contacts</a>
            <p-button [icon]="isDarkMode ? 'pi pi-moon' : 'pi pi-sun'" (onClick)="toggleDarkMode()"
            [style]="{'color': 'var(--p-text-default)', 'background-color': 'transparent', 'border-color': 'transparent'}"
            [class.hidden]="isMobileMenuOpen? false : true"
            [class.flex]="isMobileMenuOpen" [class.hidden]="!isMobileMenuOpen"
            aria-label="Toggle theme" variant="text" />
          </div>
        </div>
        <div class="max-lg:hidden flex items-center gap-2">
          <p-button [icon]="isDarkMode ? 'pi pi-moon' : 'pi pi-sun'" (onClick)="toggleDarkMode()"
            [style]="{'color': 'var(--p-text-default)', 'background-color': 'transparent', 'border-color': 'transparent'}"
            aria-label="Toggle theme" variant="text" />
          <p-button label="Login"
            [style]="{'background-color': 'var(--p-primary-color)', 'border-color': 'var(--p-primary-color)'}" />
        </div>
      </div>
    </nav>
  </header>

  <main class="h-screen animate-fadein anima">
    <div
      class="flex h-full flex-col justify-between gap-18 overflow-x-hidden pt-40 md:gap-24 md:pt-45 lg:gap-35 lg:pt-47.5">
      <div
        class="mx-auto flex max-w-7xl flex-col items-center gap-8 justify-self-center px-4 text-center sm:px-6 lg:px-8">
        <div class="flex w-fit items-center gap-2.5 rounded-full border px-3 py-2"
          style="background-color: var(--p-highlight-background); border-color: var(--p-border-color);">
          <span class="shrink-0 rounded-full px-3 py-1 text-xs font-semibold"
            style="background-color: var(--p-primary-color); color: var(--p-primary-inverse-color);">
            AI-Powered
          </span>
          <span style="color: var(--p-text-muted);">Delivery management system</span>
        </div>
        <h1 class="relative z-1 text-5xl leading-[1.15] font-bold max-md:text-2xl md:max-w-3xl md:text-balance"
          style="color: var(--p-text-default);">
          <span class="text-5xl">Vroom It. Track It. Done</span>
          <svg width="223" height="12" viewBox="0 0 223 12" fill="none" xmlns="http://www.w3.org/2000/svg"
            class="absolute -bottom-1.5 left-10 -z-1 max-lg:left-4 max-md:hidden">
            <path
              d="M1.30466 10.7431C39.971 5.28788 76.0949 3.02 115.082 2.30401C143.893 1.77489 175.871 0.628649 204.399 3.63102C210.113 3.92052 215.332 4.91391 221.722 6.06058"
              stroke="url(#paint0_linear_10365_68643)" stroke-width="2" stroke-linecap="round" />
            <defs>
              <linearGradient id="paint0_linear_10365_68643" x1="19.0416" y1="4.03539" x2="42.8362" y2="66.9459"
                gradientUnits="userSpaceOnUse">
                <stop offset="0.2" stop-color="var(--p-primary-color)" />
                <stop offset="1" stop-color="var(--p-primary-inverse-color)" />
              </linearGradient>
            </defs>
          </svg>
        </h1>
        <p class="max-w-3xl" style="color: var(--p-text-muted);">
          Revolutionize your delivery experience in Aswan with real-time tracking, optimized routes, and seamless
          service powered by VROOM.
        </p>

        <a href="#" class="inline-flex items-center gap-2 rounded-lg px-8 py-4 text-lg font-semibold transition-all"
          style="background: linear-gradient(135deg, var(--p-primary-color), var(--p-primary-inverse-color)); color: var(--p-primary-inverse-color);">
          Try it Now
          <span class="text-lg">→</span>
        </a>
      </div>

    </div>
  </main>
</div>
