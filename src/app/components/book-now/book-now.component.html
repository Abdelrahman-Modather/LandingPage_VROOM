<div class="card p-10 bg-[var(--p-surface-background)]">
  <h1
    class="mb-10 text-center text-5xl lg:text-7xl font-bold text-[var(--p-primary-color)]"
  >
    LIVE <span class="text-gradient">THE PROCESS</span>
  </h1>
  <p-timeline
    [value]="events"
    align="alternate"
    styleClass="customized-timeline"
  >
    <ng-template #marker let-event>
      <span
        class="flex w-8 h-8 items-center justify-center text-[var(--p-primary-inverse-color)] rounded-full z-10 shadow-sm"
        [style]="{ 'background-color': 'var(--p-primary-color)' }"
      >
        <i [class]="event.icon"></i>
      </span>
    </ng-template>
    <ng-template #content let-event>
      <p-card
        [header]="event.status"
        [style]="{
          'background-color': 'var(--p-surface-background)',
          border: '1px solid var(--p-primary-color)',
          color: 'var(--p-primary-color)'
        }"
      >
        <p class="text-[var(--p-highlight-color)]">
          {{ event.content }}
        </p>
        <p-button
          label="Read more"
          [style]="{ color: 'var(--p-primary-color)' }"
          [text]="true"
        />
      </p-card>
    </ng-template>
  </p-timeline>
</div>
